
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض مشاريعي الاحترافي</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 40px 20px; 
            color: var(--text-main);
            line-height: 1.6;
        }

        header { 
            text-align: center; 
            padding: 50px 30px; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 1100px;
            margin: 0 auto 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 { margin: 0 0 12px 0; color: var(--text-main); font-size: 2.5rem; font-weight: 800; letter-spacing: -0.5px; }
        .title-tag { font-size: 1.2rem; color: var(--accent); font-weight: 600; margin-bottom: 15px; }
        .bio { font-size: 1.05rem; color: var(--text-muted); max-width: 650px; margin: 0 auto 25px auto; }
        
        .links a { 
            margin: 0 12px; 
            color: var(--text-main); 
            text-decoration: none; 
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.25s ease;
        }
        .links a:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        .projects-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
            max-width: 1160px; 
            margin: 0 auto; 
        }

        .project-card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease; 
        }
        .project-card:hover { 
            transform: translateY(-6px); 
            border-color: rgba(56, 189, 248, 0.4);
        }

        .project-img { width: 100%; height: 190px; object-fit: cover; background: #334155; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .project-info { padding: 24px; }
        .project-info h3 { margin: 0 0 10px 0; color: var(--text-main); font-size: 1.3rem; }
        .project-info p { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 20px 0; height: 70px; overflow: hidden; text-overflow: ellipsis; }
        
        .project-link { 
            display: inline-block; 
            background: var(--accent); 
            color: #0f172a; 
            padding: 10px 20px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .project-link:hover { background: var(--accent-hover); }
        
        .error-msg { text-align: center; padding: 40px; background: rgba(239, 68, 68, 0.1); border-radius: 12px; border: 1px solid #ef4444; max-width: 500px; margin: 40px auto; }
    </style>
</head>
<body>

    <header id="profile-header">
        <h1 id="user-name">جاري تحميل المعرض...</h1>
        <div id="user-title" class="title-tag"></div>
        <p id="user-bio" class="bio"></p>
        <div id="user-links" class="links"></div>
    </header>

    <main class="projects-grid" id="projects-container">
        <!-- يتم جلب المشاريع هنا -->
    </main>

    <script>
        // مضاف إليه محدد وقت لتجنب كاش المتصفح القديم لجلب البيانات الحية فورا
        fetch('data.json?v=' + new Date().getTime())
            .then(res => {
                if(!res.ok) throw new Error("ملف البيانات غير موجود");
                return res.json();
            })
            .then(data => {
                document.getElementById('user-name').innerText = data.profile.name || 'مرحباً بك في معرضي';
                document.getElementById('user-title').innerText = data.profile.title || '';
                document.getElementById('user-bio').innerText = data.profile.bio || '';
                
                let linksHtml = '';
                if(data.profile.github) linksHtml += `<a href="${data.profile.github}" target="_blank">GitHub</a>`;
                if(data.profile.linkedin) linksHtml += `<a href="${data.profile.linkedin}" target="_blank">LinkedIn</a>`;
                if(data.profile.email) linksHtml += `<a href="mailto:${data.profile.email}">البريد</a>`;
                document.getElementById('user-links').innerHTML = linksHtml;

                let projectsHtml = '';
                if(!data.projects || data.projects.length === 0) {
                    projectsHtml = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد مشاريع مضافة حالياً. اذهب للوحة التحكم لإضافة أول مشروع!</div>';
                } else {
                    data.projects.forEach(proj => {
                        projectsHtml += `
                            <div class="project-card">
                                <img class="project-img" src="${proj.image || 'https://unsplash.com'}" alt="${proj.title}">
                                <div class="project-info">
                                    <h3>${proj.title}</h3>
                                    <p>${proj.description}</p>
                                    ${proj.link ? `<a class="project-link" href="\${proj.link}" target="_blank">معاينة المشروع ←</a>` : ''}
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('projects-container').innerHTML = projectsHtml;
            })
            .catch(err => {
                document.getElementById('profile-header').innerHTML = `
                    <div class="error-msg">
                        <h3>حدث خطأ أثناء تحميل البيانات</h3>
                        <p>تأكد من إنشاء ملف يحمل اسم <strong>data.json</strong> داخل المستودع وتعبئته بشكل صحيح.</p>
                    </div>
                `;
                console.error(err);
            });
    </script>
</body>
</html>
